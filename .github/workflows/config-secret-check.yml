name: Config secret check

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

jobs:
  generate-config:
    name: Generate js/config.js from secret
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure scripts are executable
        run: |
          chmod +x scripts/generate-config.sh || true

      - name: Generate config.js (from SUPABASE_ANON_KEY secret)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "SUPABASE_ANON_KEY not provided as secret. Generating placeholder config.js"
          fi
          bash scripts/generate-config.sh

      - name: Upload generated config.js as artifact
        uses: actions/upload-artifact@v4
        with:
          name: config-js
          path: js/config.js

  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan repository for high-risk secrets
        run: |
          set -e
          echo "Procurando por padrões de chaves sensíveis..."
          # padrões que queremos flagar rapidamente
          PATTERNS=(
            "sb_publishable_"
            "SERVICE_ROLE"
            "AKIA[0-9A-Z]{16}"
            "aws_secret_access_key"
            "ghp_[A-Za-z0-9_]{36}"
            "-----BEGIN (PRIVATE KEY|RSA PRIVATE KEY|OPENSSH PRIVATE KEY)"
          )

          # Exclusões:
          #  - .git/node_modules: irrelevantes
          #  - js/vendor: bibliotecas de terceiros vendorizadas (ex.: o SDK do
          #    Supabase contém literalmente a string "sb_publishable_" na sua
          #    própria lógica de validação de chave — não é um segredo)
          #  - este próprio workflow: contém os padrões acima como texto literal
          #    (a lista PATTERNS), o que faria o scan se autodetectar como "achado"
          # --exclude-dir casa pelo nome do diretório (basename), não pelo
          # caminho completo — por isso é "vendor", não "js/vendor".
          GREP_ARGS=(
            -RIn
            --exclude-dir=.git
            --exclude-dir=node_modules
            --exclude-dir=vendor
            --exclude=config-secret-check.yml
          )

          FAIL=0
          for p in "${PATTERNS[@]}"; do
            if grep "${GREP_ARGS[@]}" -E "$p" . >/dev/null 2>&1; then
              echo "Encontrado padrão: $p"
              grep "${GREP_ARGS[@]}" -E "$p" || true
              FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "Falha: possíveis segredos encontrados — corrija antes de subir para o repositório." >&2
            exit 1
          fi

          echo "Nenhum segredo de alto risco detectado pelo scanner rápido."

  detect-secrets-scan:
    name: Deep scan with detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets

      - name: Run detect-secrets scan
        run: |
          set -euo pipefail
          # js/vendor é código de terceiros vendorizado (minificado): strings de
          # alta entropia (hashes, base64) nesses bundles disparam falsos
          # positivos no detector de entropia sem indicar segredo algum.
          #
          # .git/**: arquivos internos do git (ex.: FETCH_HEAD, com o SHA do
          # commit buscado pelo actions/checkout) não fazem parte do
          # repositório e não são de código nosso; `--all-files` não exclui
          # `.git` por padrão como o scan rápido acima (`--exclude-dir=.git`).
          #
          # este próprio workflow: o parser YAML do detect-secrets junta todo
          # o bloco `run: |` deste step num único valor associado à linha da
          # chave `run:`. A mensagem de log "nenhum segredo em potencial
          # encontrado" contém a palavra "segredo" e dispara falso positivo
          # do plugin Secret Keyword — mesmo motivo pelo qual o scan rápido
          # já exclui este arquivo (`--exclude=config-secret-check.yml`).
          detect-secrets scan --all-files \
            --exclude-files 'js/vendor/.*' \
            --exclude-files '\.git/.*' \
            --exclude-files '\.github/workflows/config-secret-check\.yml' \
            > .secrets.baseline

          # `detect-secrets scan` always emits a JSON baseline (version, plugins_used,
          # results, ...) even when nothing is found, so checking "file is non-empty"
          # would fail on every run. Inspect the actual `results` map instead: if
          # jq is unavailable or the output isn't valid JSON, fail closed rather
          # than silently passing.
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq não encontrado no runner — não é possível validar o baseline com segurança." >&2
            exit 1
          fi

          if ! jq -e . .secrets.baseline >/dev/null 2>&1; then
            echo "Saída do detect-secrets não é um JSON válido — falhando por segurança." >&2
            cat .secrets.baseline >&2
            exit 1
          fi

          FINDINGS=$(jq '[.results[]] | add // [] | length' .secrets.baseline)
          if [ "$FINDINGS" -gt 0 ]; then
            echo "detect-secrets encontrou $FINDINGS possível(is) segredo(s):" >&2
            jq '.results' .secrets.baseline >&2
            exit 1
          fi

          echo "detect-secrets: nenhum segredo em potencial encontrado."

  deploy-example:
    name: "Example: build + deploy (manual)"
    needs: generate-config
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download generated config
        uses: actions/download-artifact@v4
        with:
          name: config-js

      - name: Show config (sanity)
        run: |
          echo "Workspace files:"
          ls -la
          echo "js/config.js preview:"
          if [ -f js/config.js ]; then sed -n '1,120p' js/config.js; else echo "js/config.js not found"; fi

      - name: Build (if package.json present)
        run: |
          if [ -f package.json ]; then
            npm ci --silent
            if npm run | grep -q "build"; then
              npm run build
            else
              echo "No build script defined in package.json; skipping build"
            fi
          else
            echo "No package.json — skipping build step"
          fi

      # Deployment steps are intentionally omitted here to avoid accidental deploys.
      # Example: deploy to GitHub Pages (uncomment and configure if desired)
      # - name: Deploy to GitHub Pages
      #   uses: peaceiris/actions-gh-pages@v3
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: ./

